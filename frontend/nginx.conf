server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Look the backend up through Docker's DNS on each request (cached 10 s) instead of once at
    # startup: a recreated backend container gets a new IP, and a static proxy_pass would keep
    # sending /api to the old one (502) until nginx restarts. A variable in proxy_pass is what makes
    # nginx use the resolver; without a URI part it still passes the request URI unchanged.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;

    # Proxy /api to backend
    location /api {
        client_max_body_size 4g;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Invite tokens and OIDC codes travel in the query string: keep them out of access logs
    location /api/auth/ {
        access_log off;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
