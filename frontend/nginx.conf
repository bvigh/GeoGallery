server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Look the backend up through Docker's DNS on each request (cached 10 s) instead of once at
    # startup: a recreated backend container gets a new IP, and a static proxy_pass would keep
    # sending /api to the old one (502) until nginx restarts. A variable in proxy_pass is what makes
    # nginx use the resolver; without a URI part it still passes the request URI unchanged.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;

    # The Map's and the Game's filters send one trip_id or album_id per ticked collection, about
    # 45 bytes each, and the filter panel's "Select all" ticks every match at once. The request line
    # must fit one of these buffers: nginx's default 8k refuses one with more than about 175 IDs
    # (414), 32k takes about 700. Allocated only for a request whose headers outgrow 1k.
    large_client_header_buffers 4 32k;

    # Proxy /api to backend
    location /api {
        client_max_body_size 4g;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # nginx's default gives up after 60 s, which closes the upstream connection, cancels the request
    # and stops the matcher at its next query, with no transaction.
    location = /api/gps-matcher/run {
        proxy_read_timeout 900s;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The Checks view's file comparison works for up to a minute and then answers with what it has. Leave it
    # room, so nginx's 60 s default does not cut the answer it is about to send.
    location = /api/checks/agreement {
        proxy_read_timeout 120s;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # A capture time change answers only after its transaction and a follow-up of up to 2 minutes
    # (the matcher near the changed times, then trip detection). With nginx's 60 s default, a 504
    # could come after the shift was committed and invite a second one. The backend refuses a body
    # over its own limit (1 MiB for a shift, 16 KiB for a set) with a reason, so leave it the choice.
    location = /api/media/shift-time {
        client_max_body_size 2m;
        proxy_read_timeout 300s;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # A regular expression location wins over the /api prefix above, which has no ^~.
    location ~ ^/api/media/[^/]+/taken-at$ {
        client_max_body_size 2m;
        proxy_read_timeout 300s;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Invite tokens and OIDC codes travel in the query string: keep them out of access logs
    location /api/auth/ {
        access_log off;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
